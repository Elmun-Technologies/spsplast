<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>SPS header</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sps/tokens.css">
<link rel="stylesheet" href="ds/sps/components/bundle.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.hd{position:sticky;top:0;z-index:30;background:var(--surface);font-family:var(--font-sans);border-bottom:1px solid var(--line)}
.hd-top{height:72px;display:flex;align-items:center;gap:20px}
.hd-cat{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 18px;background:var(--ink);color:var(--surface);border-radius:999px;font:600 15px/20px var(--font-sans);text-decoration:none;white-space:nowrap}
.hd-search{flex:1;min-width:0;display:flex;align-items:center;height:44px;border:1px solid var(--line-strong);border-radius:999px;padding:0 4px 0 14px;gap:10px;color:var(--ink-muted)}
.hd-search input{flex:1;min-width:0;border:0;outline:0;font:400 15px/20px var(--font-sans);background:none;color:var(--ink)}
.hd-ic{position:relative;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;flex:none}
.hd-badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;box-sizing:border-box;border-radius:10px;background:var(--red);color:#fff;font:600 11px/20px var(--font-mono);text-align:center;padding:0 5px}
.hd-badge-0{display:none}
.hd-tel{display:none}
.hd-nav{height:44px;display:flex;align-items:center;gap:24px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.hd-nav a{font:500 14px/20px var(--font-sans);color:var(--ink);text-decoration:none;white-space:nowrap;height:44px;display:flex;align-items:center;border-bottom:2px solid transparent}
.hd-nav a:hover{color:var(--red-ink)}
.hd-nav .sep{width:1px;height:20px;background:var(--line);flex:none}
.hd-nav .num{font:500 12px/16px var(--font-mono);color:var(--ink-muted);margin-left:6px}
.hd-burger{display:none}
@media (max-width:1100px){.hd-phone,.hd-cat span{display:none!important}.hd-cat{padding:0 12px}}
@media (max-width:760px){.hd-top{height:auto;gap:8px;flex-wrap:wrap;padding-top:10px}.hd-logo{margin-right:auto}.hd-logo img{height:32px!important}.hd-search{order:9;flex:1 1 100%;margin-bottom:10px;height:44px}.hd-search .sps-btn{display:none}.hd-cta,.hd-lang,.hd-cat{display:none!important}.hd-burger,.hd-tel{display:inline-flex}.hd-nav{gap:18px;height:42px}.hd-nav a{height:42px;font-size:13px}.hd-nav .sep,.hd-nav .pdf{display:none}}
</style>
</helmet>
<header class="hd sps">
<div class="wrap">
<div class="hd-top">
<a class="hd-logo" href="Main.dc.html" style="display: block; flex: none"><img src="/_blob/3f4c062957d38428c1377792030ad8f0" alt="SPS Stone Profy Servise" style="height: 38px; width: auto"></a>
<a class="hd-cat" href="Catalog.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg><span>Katalog · 152</span></a>
<label class="hd-search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="search" placeholder="Model nomi yoki kodi: Monako, 70" aria-label="Katalogdan qidirish"><span class="sps-btn sps-btn--dark sps-btn--sm" style="height: 34px">Qidirish</span></label>
<div class="hd-phone" style="display: flex; flex-direction: column; line-height: 1.2"><span class="mono" style="font-size: 15px; font-weight: 500; color: var(--ink); white-space: nowrap">+998 98 300 77 72</span><span style="font-size: 12px; color: var(--ink-muted)">Du–Sha · 09:00–18:00</span></div>
<div class="sps-lang hd-lang"><a href="#" aria-current="true">UZ</a><a href="#">RU</a><a href="#">EN</a></div>
<a class="hd-ic hd-ic-cmp" href="Compare.dc.html" aria-label="Solishtirish: {{cmp}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 20V10M12 20V4M18 20v-7"></path></svg><b class="{{cmpCls}}">{{cmp}}</b></a>
<a class="hd-ic" href="RequestList.dc.html" aria-label="Zayafka ro'yxati: {{list}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="4" width="14" height="17" rx="1"></rect><path d="M9 4h6v3H9zM9 12h6M9 16h4"></path></svg><b class="{{listCls}}">{{list}}</b></a>
<a class="hd-ic hd-tel" href="tel:+998983007772" aria-label="Qo'ng'iroq qilish: +998 98 300 77 72"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg></a>
<a class="sps-btn sps-btn--primary hd-cta" href="RequestList.dc.html">Zayafka qoldirish</a>
<a class="hd-ic hd-burger" href="MMenu.dc.html" aria-label="Menyu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></a>
</div>
<nav class="hd-nav" aria-label="Bo'limlar">
<a href="Catalog.dc.html" style="{{n1}}">Trotuar plitkasi<span class="num">91</span></a>
<a href="Catalog.dc.html">Fasad<span class="num">26</span></a>
<a href="Catalog.dc.html">Zabor panellari<span class="num">10</span></a>
<a href="Catalog.dc.html">Dekor panellar<span class="num">18</span></a>
<a href="Catalog.dc.html">Skameyka oyoqlari<span class="num">7</span></a>
<i class="sep"></i>
<a href="Partners.dc.html" style="{{n2}}">Ulgurji va hamkorlik</a>
<a href="Production.dc.html" style="{{n3}}">Ishlab chiqarish</a>
<a href="Production.dc.html">Eksport</a>
<a href="Contact.dc.html" style="{{n4}}">Kontakt</a>
<a class="pdf" href="#" style="margin-left: auto; color: var(--red-ink)">PDF katalog ↓</a>
</nav>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","catalog","partners","production","contact"],"default":"home"},"cmp":{"editor":"int","default":2},"list":{"editor":"int","default":1},"$preview":{"width":1440,"height":117}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'home';
    const on = 'border-bottom-color: var(--red)';
    const cmp = this.props.cmp ?? 2;
    const list = this.props.list ?? 1;
    return { n1: cur === 'catalog' ? on : '', n2: cur === 'partners' ? on : '', n3: cur === 'production' ? on : '', n4: cur === 'contact' ? on : '', cmp, list, cmpCls: cmp > 0 ? 'hd-badge' : 'hd-badge hd-badge-0', listCls: list > 0 ? 'hd-badge' : 'hd-badge hd-badge-0' };
  }
}
</script>
</body>
</html>
