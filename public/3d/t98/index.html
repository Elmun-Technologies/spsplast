<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ТОМИР 15×15 — 3D · SPS</title>
<meta name="description" content="Форма Томир 15×15: фото формы и укладки — Stone Profy Servise"><style>:root{--bg:#f4f0e9;--ink:#1c1b1a;--mut:#6b655c;--red:#d3202a;--card:#fff;--line:#d8d0c2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171615;--ink:#ece7df;--mut:#a39c90;--card:#22201e;--line:#35322e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:0 16px}header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}header img{height:34px}
header a{color:var(--mut);font-size:13px;text-decoration:none}.k{color:var(--red);font:700 11px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;margin:8px 0 6px}
h1{font:800 clamp(26px,6vw,40px)/1.05 system-ui;margin:0 0 10px;text-transform:uppercase}.sp{display:flex;gap:10px 22px;flex-wrap:wrap;color:var(--mut);font-size:14px;margin-bottom:14px}.sp b{color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 4px;border-radius:10px;font:600 13px/1.2 system-ui;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tabs button:disabled{opacity:.4;cursor:default}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}model-viewer{width:100%;height:min(66vh,520px);background:radial-gradient(#3d3b38,#121314);--poster-color:transparent}

.hint{font-size:12px;color:var(--mut);padding:8px 12px}.gal{display:grid;gap:8px;padding:8px}.gal img{width:100%;border-radius:10px;display:block}
footer{padding:24px 0 40px;color:var(--mut);font-size:13px}footer a{color:var(--red);font-weight:700;text-decoration:none}[hidden]{display:none!important}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0 24px}.g a{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:var(--ink)}
.g img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#ddd}.g span{display:block;padding:8px 10px;font:700 12px/1.25 system-ui}.g small{display:block;color:var(--mut);font-weight:500}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px system-ui;margin:10px 0}</style></head><body><div class="w"><header><a href="/3d/"><img src="/3d/assets/logo.png" alt="SPS"></a><a href="/3d/">Все формы →</a></header>
<div class="k">Тротуарная плитка · 98</div><h1>ТОМИР 15×15</h1>
<div class="sp"><span>Размер <b>150×150×25 мм (и 53×53×25 мм)</b></span><span>Глубина формы <b>25 мм</b></span><span>На 1 м² <b>40 + 40 шт</b></span></div>
<div class="tabs" role="tablist" style="grid-template-columns:repeat(2,1fr)"><button role="tab" data-k="qolip" aria-selected="true">Форма</button><button role="tab" data-k="sahna" aria-selected="false">На объекте</button></div>
<div class="st"><div id="g-qolip" class="gal"><img src="/3d/t98/qolip.jpg" alt="Форма Томир 15×15"></div><div id="g-sahna" class="gal" hidden><img loading="lazy" src="/3d/t98/sahna.jpg" alt="Томир 15×15 — укладка"></div><div class="hint">3D-модель этой формы готовится</div></div>
<footer>Stone Profy Servise · <a href="tel:+998983007772">+998 (98) 300-77-72</a></footer></div>
<script>function go(k){document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));['qolip','sahna'].forEach(x=>document.getElementById('g-'+x).hidden=x!==k);history.replaceState(null,'','#'+k)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.k));go((location.hash||'').slice(1)==='sahna'?'sahna':'qolip');</script></body></html>
