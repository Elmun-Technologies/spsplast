name: Cron — integratsiya navbati

# Fly.io da Vercel Cron yo'q. Eng sodda yechim: GitHub Actions soatiga bir marta
# `/api/cron/integrations` ni chaqiradi (amoCRM/Telegram navbatini ishlaydi).
#
# Kerakli secretlar: GitHub → Settings → Secrets → Actions
#   SITE_URL     = https://sps.uz
#   CRON_SECRET  = fly secrets dagi bilan bir xil qiymat
#
# Muqobil: Fly scheduled machine —
#   fly machine run . --schedule hourly --command "curl -fsS -H 'Authorization: Bearer $CRON_SECRET' $SITE_URL/api/cron/integrations"
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Cron endpointni chaqirish
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/integrations")
          echo "HTTP $code"
          cat /tmp/out.json
          test "$code" = "200"
