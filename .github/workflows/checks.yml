name: checks

# Stage 6 tekshiruvlari CI'da: agent sandbox'ida brauzer yo'q edi, GitHub runner'da
# bor — shuning uchun skrinshot solishtirish va Lighthouse shu yerda haqiqatan yuradi.
# Natijalar run summary'ga, PR izohiga va artefaktga tushadi.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    # `shell: bash` aniq yozilganda GitHub `bash -eo pipefail` ishlatadi. Yozilmasa — `bash -e`,
    # ya'ni `npm run audit:seo | tee …` da xato kodi `tee` ga yutilib, audit xato topsa ham qadam
    # yashil chiqardi (audit 2026-11-02, texnik).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bog'liqliklar
        run: npm ci --no-audit --no-fund

      - name: Xavfsizlik — production paketlari (npm audit)
        # Faqat saytga chiqadigan paketlar: high/critical bo'lsa job yiqiladi.
        # Dev vositalari (eslint, drizzle-kit) build vaqtida ishlaydi, saytga chiqmaydi.
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Testlar (node:test)
        run: npm test

      - name: Build (statik sahifalar)
        run: npm run build

      - name: Serverni ishga tushirish
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/uz || true)
            if [ "$code" = "200" ]; then echo "server tayyor (${i}s)"; exit 0; fi
            sleep 1
          done
          echo "server ishga tushmadi:"; tail -40 /tmp/next-start.log; exit 1

      # Audit va skrinshot qadamlari darhol to'xtatmaydi (hisobot, PR izohi va artefakt baribir
      # chiqsin), lekin oxiridagi "Yakuniy natija" qadami ularning natijasi bo'yicha job'ni qizartiradi.
      - name: SEO/DOM auditi (jsdom)
        id: audit_seo
        continue-on-error: true
        run: npm run audit:seo 2>&1 | tee /tmp/audit-seo.log

      - name: A11y auditi (axe-core)
        id: audit_a11y
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run audit:a11y 2>&1 | tee /tmp/audit-a11y.log

      - name: Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Screenshotlar — 390 / 1440 / 360 px
        # Qat'iy qadam (gorizontal scroll yoki ochilmagan holat qizil belgilanadi),
        # lekin job'ni to'xtatmaydi: aks holda Lighthouse va PR izohi ishlamaydi,
        # demak muammoni ko'rsatadigan yagona kanal ham yo'qoladi.
        id: shots
        continue-on-error: true
        run: npm run shots 2>&1 | tee /tmp/shots.log

      - name: Lighthouse (mobil + desktop)
        # Screenshot qadami yiqilsa ham yuradi; CI ballari shovqinli bo'lgani uchun
        # byudjet buzilishi job'ni qizartirmaydi — sonlar hisobot va izohda ko'rinadi.
        # PR'da har sahifa 1 marta (tez, ~4 daqiqa), `main` ga push'da 3 marta + mediana
        # (aniq, ~10 daqiqa): 48 ta o'lchov har PR'ni 13 daqiqa ushlab turardi.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          LH_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
        run: npm run lighthouse 2>&1 | tee /tmp/lighthouse.log

      - name: Hisobotlarni yig'ish (run summary)
        if: always()
        run: |
          {
            echo "## Tekshiruv natijalari"
            echo
            # Har turdan faqat ENG YANGI hisobot (git'dagi eski sanali fayllar ham shu papkada —
            # ilgari hammasi chiqib, joriy natija izohning oxiriga tushib qolardi).
            for f in $(for k in seo-dom a11y visual lighthouse; do ls docs/audits/$k-*.md 2>/dev/null | sort | tail -n 1; done); do
              [ -f "$f" ] || continue
              echo "### $(basename "$f")"
              echo
              sed -n '1,40p' "$f"
              echo
            done
            echo "### Qadamlar loglari (oxiri)"
            for log in /tmp/audit-seo.log /tmp/audit-a11y.log /tmp/shots.log /tmp/lighthouse.log; do
              [ -f "$log" ] || continue
              echo
              echo "#### $(basename "$log")"
              echo
              echo '```'
              tail -n 20 "$log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Natijalarni PR izohiga yozish
        # Izoh orqali natijalar GitHub API'dan ham o'qiladi (artefakt/log'lar
        # ba'zi muhitlarda yuklab olinmaydi).
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          out=/tmp/ci-summary.md
          {
            echo "<!-- spsplast-checks -->"
            echo "### Tekshiruv natijalari (CI run ${{ github.run_id }}, ${{ github.sha }})"
            echo
            # Har turdan faqat ENG YANGI hisobot (git'dagi eski sanali fayllar ham shu papkada —
            # ilgari hammasi chiqib, joriy natija izohning oxiriga tushib qolardi).
            for f in $(for k in seo-dom a11y visual lighthouse; do ls docs/audits/$k-*.md 2>/dev/null | sort | tail -n 1; done); do
              [ -f "$f" ] || continue
              echo "#### $(basename "$f")"
              echo
              # Lighthouse hisoboti to'liq chiqadi: "ballni tushirgan auditlar"
              # bo'limi faylning oxirida — kesilsa, sabab ko'rinmay qoladi.
              case "$f" in
                *lighthouse-*) sed -n '1,300p' "$f" ;;
                # Vizual hisobotda 28 qatorli surat jadvali bor; undan keyin
                # tegish maydoni (44px) bo'limi keladi — qaror uchun ko'rinishi shart.
                *visual-*) sed -n '1,150p' "$f" ;;
                *a11y-*) sed -n '1,20p' "$f" ;;
                *) sed -n '1,45p' "$f" ;;
              esac
              echo
            done
            for log in /tmp/shots.log /tmp/lighthouse.log; do
              [ -f "$log" ] || continue
              echo
              echo "#### $(basename "$log") (oxiri)"
              echo
              echo '```'
              tail -n 40 "$log"
              echo '```'
            done
          } > "$out"

          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.body | contains("<!-- spsplast-checks -->"))] | last | .id' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$out" --jq .id > /dev/null
            echo "PR izohi yangilandi: #$existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$out" --jq .id > /dev/null
            echo "PR izohi qo'shildi"
          fi

      - name: Hisobotlar va screenshotlar (artefakt)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tekshiruv-hisobotlari
          path: |
            docs/audits/
            screens-actual/
            /tmp/shots.log
            /tmp/lighthouse.log
          if-no-files-found: warn
          retention-days: 30

      - name: Yakuniy natija (audit va skrinshotlar)
        if: ${{ !cancelled() }}
        env:
          SEO: ${{ steps.audit_seo.outcome }}
          A11Y: ${{ steps.audit_a11y.outcome }}
          SHOTS: ${{ steps.shots.outcome }}
        run: |
          echo "audit:seo=$SEO audit:a11y=$A11Y shots=$SHOTS"
          fail=0
          for o in "$SEO" "$A11Y" "$SHOTS"; do
            if [ "$o" = "failure" ]; then fail=1; fi
          done
          if [ "$fail" = 1 ]; then echo "::error::Audit yoki skrinshot qadami xato topdi — yuqoridagi loglar va artefaktni ko'ring"; exit 1; fi
